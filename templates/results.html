<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Clarity Results</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SHNFKJPC74"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SHNFKJPC74');
  </script>
</head>
<body class="inner-page-body">

  <div class="results-card">
    <h2 class="tier-title">Tier One Context</h2>
    <div class="tier-content" id="tier1"></div>
  </div>

  <div class="results-card">
    <h2 class="tier-title">Tier Two Context</h2>
    <div class="tier-content" id="tier2"></div>
  </div>

  <div class="results-card">
    <h2 class="tier-title">Tier Three Context</h2>
    <div class="tier-content" id="tier3"></div>
  </div>

  <div class="results-card" id="radiance-text-card" style="display: none;">
    <h2 class="tier-title">Radiant Insight</h2>
    <div class="tier-content" id="radiance-text" style="font-style: italic; color: #2c5d63;"></div>
  </div>

  <div class="results-card" style="text-align: center;">
    <button id="radiance-btn" class="back-button" style="margin-top: 0; width: 100%;">
      Visualize Insight (Radiance Mode)
    </button>
    <div id="image-loading" style="display: none; margin-top: 20px; font-style: italic;">
      Generating your vision...
    </div>
    <div id="image-container" style="margin-top: 20px;"></div>
  </div>

  <button class="back-button" onclick="window.location.href='/home'">← Back to Home</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Retrieve everything from localStorage
      const tier1 = localStorage.getItem("summary_1") || "No result found.";
      const tier2 = localStorage.getItem("summary_2") || "No result found.";
      let tier3 = localStorage.getItem("summary_3") || "No result found.";
      const radianceText = localStorage.getItem("summary_radiance");

      // 2. Fix the [object Object] issue for Tier 3
      // If it's a string that looks like an object, we give it a clean fallback
      if (tier3 === "[object Object]" || (typeof tier3 === 'string' && tier3.includes("[object Object]"))) {
          tier3 = "Synthesis complete. Exploring deeper implications...";
      }

      // 3. Display the text results in their slots
      document.getElementById('tier1').textContent = tier1;
      document.getElementById('tier2').textContent = tier2;
      document.getElementById('tier3').textContent = tier3;

      // 4. Show the Radiant Insight card ONLY if we have the data
      if (radianceText && radianceText !== "undefined" && radianceText !== "null") {
        document.getElementById('radiance-text-card').style.display = 'block';
        document.getElementById('radiance-text').textContent = radianceText;
      }

      const radianceBtn = document.getElementById("radiance-btn");
      const loadingDiv = document.getElementById("image-loading");
      const container = document.getElementById("image-container");

      radianceBtn.addEventListener("click", async () => {
        // Use Tier 3 as the visual seed
        const prompt = tier3;

        radianceBtn.disabled = true;
        loadingDiv.style.display = "block";
        container.innerHTML = "";

        try {
          const response = await fetch("/generate-image", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });

          if (!response.ok) throw new Error('Image generation failed');

          const data = await response.json();
          const imageUrl = data.image_url;

          container.innerHTML = `
            <img src="${imageUrl}" alt="Radiance Output" 
                 style="max-width:100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);" />
          `;
        } catch (error) {
          console.error("Error generating image:", error);
          container.textContent = "Unable to visualize at this moment. Please try again.";
        } finally {
          radianceBtn.disabled = false;
          loadingDiv.style.display = "none";
        }
      });
    });
  </script>
</body>
</html>
