<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Context Finder — Synthesis Results</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SHNFKJPC74"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SHNFKJPC74');
  </script>

  <style>
    .stage-heading {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #005f5f;
      margin: 0 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0, 128, 128, 0.2);
    }

    .tier-three-highlight {
      border-left: 4px solid #008080;
      padding-left: 14px;
      font-weight: 500;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .secondary-button {
      background-color: transparent;
      color: #005f5f;
      border: 1.5px solid #008080;
      padding: 0.55rem 1rem;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .secondary-button:hover {
      background-color: rgba(0, 128, 128, 0.1);
    }

    .radiance-subtext {
      font-size: 0.92rem;
      color: #2c4a4a;
      margin: 0 0 14px 0;
    }

    .pulse-loading {
      display: none;
      margin-top: 18px;
      font-style: italic;
      color: #005f5f;
      animation: pulseFade 1.6s infinite ease-in-out;
    }

    @keyframes pulseFade {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body class="inner-page-body">

  <div class="results-card">
    <h2 class="stage-heading">Clarity • Tier 1 — Pairwise Intersections</h2>
    <div class="tier-content" id="tier1"></div>
  </div>

  <div class="results-card">
    <h2 class="stage-heading">Clarity • Tier 2 — Converging Tension</h2>
    <div class="tier-content" id="tier2"></div>
  </div>

  <div class="results-card">
    <h2 class="stage-heading">Clarity • Tier 3 — Core Synthesis</h2>
    <div class="tier-content tier-three-highlight" id="tier3"></div>
    <div class="action-row">
      <button type="button" id="copy-btn" class="secondary-button">Copy All Tiers</button>
    </div>
  </div>

  <div class="results-card" style="text-align: center;">
    <h2 class="stage-heading" style="text-align: left;">Radiance • Visual Interpretation</h2>
    <p class="radiance-subtext">Let Radiance paint a visual scene directly from Clarity's Tier Three synthesis.</p>
    <button id="radiance-btn" class="back-button" style="margin-top: 0; width: 100%;">
      Generate Radiance
    </button>
    <div id="image-loading" class="pulse-loading">
      Radiance is painting your scene (usually 20–35 seconds)...
    </div>
    <div id="image-container" style="margin-top: 20px;"></div>
  </div>

  <button class="back-button" onclick="window.location.href='/home'">← New Synthesis</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tier1 = localStorage.getItem("summary_1") || "No result found.";
      const tier2 = localStorage.getItem("summary_2") || "No result found.";
      let tier3 = localStorage.getItem("summary_3") || "No result found.";

      if (tier3 === "[object Object]" || (typeof tier3 === 'string' && tier3.includes("[object Object]"))) {
        tier3 = "Synthesis complete. Exploring deeper implications...";
      }

      document.getElementById('tier1').textContent = tier1;
      document.getElementById('tier2').textContent = tier2;
      document.getElementById('tier3').textContent = tier3;

      const radianceBtn = document.getElementById("radiance-btn");
      const loadingDiv = document.getElementById("image-loading");
      const container = document.getElementById("image-container");

      // Prevent accidental image generation if visited without synthesis results
      if (tier3 === "No result found.") {
        radianceBtn.disabled = true;
        radianceBtn.style.opacity = "0.5";
        radianceBtn.style.cursor = "not-allowed";
      }

      // One-click copy for writers saving notes
      const copyBtn = document.getElementById("copy-btn");
      copyBtn.addEventListener("click", async () => {
        const formatted = `TIER 1 — PAIRWISE INTERSECTIONS:\n${tier1}\n\nTIER 2 — CONVERGING TENSION:\n${tier2}\n\nTIER 3 — CORE SYNTHESIS:\n${tier3}`;
        try {
          await navigator.clipboard.writeText(formatted);
          copyBtn.textContent = "Copied!";
          setTimeout(() => { copyBtn.textContent = "Copy All Tiers"; }, 2000);
        } catch (err) {
          copyBtn.textContent = "Copy failed";
        }
      });

      radianceBtn.addEventListener("click", async () => {
        const prompt = tier3;

        radianceBtn.disabled = true;
        radianceBtn.textContent = "Painting Vision...";
        loadingDiv.style.display = "block";
        container.innerHTML = "";

        try {
          const response = await fetch("/generate-image", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });

          if (!response.ok) throw new Error('Image generation failed');

          const data = await response.json();
          const imageUrl = data.image_url;

          container.innerHTML = `
            <img src="${imageUrl}" alt="Radiance Visual Synthesis" 
                 style="max-width:100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);" />
            <div style="margin-top: 12px;">
              <a href="${imageUrl}" download="context-finder-radiance.png" target="_blank" rel="noopener" class="secondary-button" style="text-decoration: none; display: inline-block;">
                Open / Save Image
              </a>
            </div>
          `;
        } catch (error) {
          console.error("Error generating image:", error);
          container.textContent = "Unable to visualize at this moment. Please try again.";
        } finally {
          radianceBtn.disabled = false;
          radianceBtn.textContent = "Generate Radiance";
          loadingDiv.style.display = "none";
        }
      });
    });
  </script>
</body>
</html>
